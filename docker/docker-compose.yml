services:
  catalog-api:
    image: catalog-api:dev
    container_name: catalog-api
    ports:
      - "5225:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  orders-api:
    image: orders-api:dev
    container_name: orders-api
    ports:
      - "5226:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CatalogApi__BaseUrl: http://catalog-api:8080
    depends_on:
      - catalog-api