name: ci

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      #- name: Restore
      #  run: dotnet restore

      - name: Restore
        run: dotnet restore microservices-demo.sln

      # Si no tienes proyectos de test, puedes comentar este paso
      # - name: Test
      #   run: dotnet test --configuration Release

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push catalog-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Catalog.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/catalog-api:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/catalog-api:latest

      - name: Build and push orders-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Orders.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orders-api:${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orders-api:latest